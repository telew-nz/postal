# Conflict tier map for the upstream sync flow.
#
# One rule per line:  <path glob>  <tier>  [action]
#
# Lines starting with '#' are comments. Matching is longest-prefix over path
# components, so `db/migrate/**` wins over `db/**`. The catch-all `*` rule is
# the default for anything not matched and can be overridden by a longer prefix.
#
# Tier semantics:
#   Tier 0 - no merge needed. Never listed here; it is the absence of conflicts.
#   Tier 1 - mechanical/cosmetic. Auto-resolved with the given action, then the
#            file is sanity-checked (still a valid file of its kind). Not gated
#            on the full suite alone; a human still sees the PR.
#   Tier 2 - structured but additive. Auto-resolved, but merged into main only
#            after the full test suite + smoke + OpenAPI contract are green and
#            a human reviews the diff.
#   Tier 3 - semantic high-risk. NEVER auto-resolved. The sync halts and emits
#            a structured report for a human. These are areas where taking
#            either side silently drops behavior (config defaults, DB schema,
#            host allowlisting, auth, dependency resolution).
#
# Actions (only meaningful for tiers 1 and 2):
#   ours       - keep this fork's version of the file.
#   theirs     - take upstream's version of the file.
#   union      - concatenate both sides. Only valid for textual/docs files.
#   stop       - (default for tier 3) do not auto-resolve.
#
# The guarantees the sync relies on:
#   - Anything in a tier 3 area that conflicts pauses the whole sync. A
#     conflict in a tier 3 path is never auto-resolved, even if the path also
#     matches a lower tier elsewhere.
#   - `*` defaults to stop. Auto-resolution is an explicit allowlist; anything
#     upstream starts touching that we have not classified pauses for review.
#     Add a rule only when you understand both sides and can name a safe action.

# --- Tier 1: mechanical / cosmetic -------------------------------------------

CHANGELOG.md                  1  union
README.md                      1  union
CONTRIBUTING.md                1  union
MIT-LICENCE                    1  theirs
SECURITY.md                    1  theirs
.gitattributes                 1  theirs
.gitignore                     1  union
.dockerignore                  1  union
Gemfile.lock                   1  theirs
doc/**                         1  union
script/production/**            1  ours
docker-compose.production.yml  1  ours
Dockerfile.production          1  ours
Dockerfile                     1  theirs
docker-compose.yml             1  theirs
Procfile.dev                   1  theirs
.semaphore/**                  1  theirs
deploy/**                      1  ours
src/**                         1  ours
.kilo/**                       1  ours

# --- Tier 2: additive, gated on the suite ------------------------------------

app/serializers/**             2  ours
app/controllers/api/**         2  ours
app/views/**                   2  ours
doc/api/**                     2  ours
spec/**                        2  union
script/smoke/**                2  ours
script/test/**                 2  ours
script/verify/**               2  ours
public/**                      2  ours

# --- Tier 3: semantic high-risk -- never auto-resolved ------------------------

# The configuration schema. Upstream moved DKIM key size/rotation here
# (d96eddb); the fork's deployment depends on the dns.* defaults. Combining
# the two is a judgment call.
lib/postal/config_schema.rb     3  stop

# Application boot and host allowlisting. config.hosts is security-critical.
config/application.rb          3  stop
config/boot.rb                 3  stop
config/initializers/**         3  stop
config/routes.rb               3  stop
config/database.yml            3  stop
config/puma.rb                 3  stop

# Database schema and migrations. MariaDB has no down migrations; a bad merge
# here is unrecoverable without a backup restore.
db/schema.rb                   3  stop
db/migrate/**                  3  stop

# Mail-handling domain logic. DKIM, DNS checks and domain verification are
# semantic; both sides have modified these files.
app/models/domain.rb           3  stop
app/models/concerns/**         3  stop
app/models/user.rb             3  stop
app/models/user_api_token.rb   3  stop
app/models/api_credential.rb   3  stop
lib/postal/api_exceptions_app.rb 3  stop
lib/postal/message_db/**       3  stop
lib/postal/smtp_server/**      3  stop

# Dependency resolution. Adding/removing gems changes the whole bundle.
Gemfile                        3  stop

# --- Default: anything unclassified pauses for a human ------------------------

*                              2  stop
