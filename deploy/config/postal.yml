# Production configuration for Postal.
#
# This file is committed and deliberately contains no site-specific values.
# Everything which differs between installations -- hostnames, DNS names,
# credentials, the tunnel address -- arrives as an environment variable from
# .env, and Postal::Config applies environment in preference to this file even
# for keys defined here. That is what allows one static file to serve every
# deployment.
#
# Environment names are the dotted config path uppercased: dns.mx_records is
# DNS_MX_RECORDS, postal.web_hostname is POSTAL_WEB_HOSTNAME.
#
# Mounted read-only at /config, which is where the image's
# POSTAL_CONFIG_FILE_PATH already points.

# Load bearing, not decorative. Without this key Postal::Config treats the file
# as the legacy v1 format and reads it through LegacyConfigSource, which maps v1
# names -- web.protocol, general.use_ip_pools, web_server.bind_address -- onto
# the current schema. None of the v2 names below appear in that mapping, so every
# one of them is ignored: the defaults apply and nothing reports an error. The
# symptom is a stack which starts cleanly and behaves as though it had no
# configuration file at all.
version: 2

postal:
  # The public URL is HTTPS even though Puma serves plaintext, because the
  # Cloudflare Tunnel terminates TLS at the edge. This has to be right: remote
  # forms in the web UI are answered with {redirect_to: ...}, which
  # redirect_to_with_json builds with url_for, so an http protocol here makes
  # every form redirect back to a plaintext origin URL the edge will not serve.
  web_protocol: https

  # The subnet the compose network is pinned to in docker-compose.yml, which is
  # where cloudflared lives. config/initializers/trusted_proxies.rb trusts only
  # loopback and IPv6 ULA by default, so without this Rack ignores
  # X-Forwarded-For and request.ip becomes the tunnel container's address rather
  # than the client's -- which is what Authie sessions and every access log
  # record.
  #
  # If the ipam subnet in docker-compose.yml changes, this has to change with it.
  # `./deploy.sh doctor` checks that the address cloudflared actually received is
  # inside this range.
  trusted_proxies:
    - 172.28.0.0/24

  # Resolves through the read-only /config mount. Generated by ./deploy.sh init
  # and gitignored: it is the DKIM private key and must never be committed or
  # baked into an image layer.
  signing_key_path: /config/signing.key

  # Overridden by POSTAL_USE_IP_POOLS. Enabling it is not just a flag: delivery
  # then binds a specific source address, which the worker can only do from the
  # host network. See the worker-hostnet service.
  use_ip_pools: false

api:
  # Stated explicitly rather than inherited from the schema default, because the
  # default is true and this is the switch which decides whether an
  # administrative interface is reachable from the internet at all. The token
  # model is user-scoped with no permission granularity, and GET /api/v2/spec is
  # unauthenticated, so anyone who can reach the hostname can enumerate every
  # operation before authenticating. See doc/deployment.md.
  enabled: true
  max_per_page: 250

web_server:
  # The schema default is 127.0.0.1, which inside a container means nothing
  # outside it can connect -- including cloudflared.
  default_bind_address: 0.0.0.0
  default_port: 5000
  max_threads: 5

main_db:
  port: 3306
  database: postal
  # The schema default of 5 is per process. Three processes share this database,
  # and the web process runs max_threads concurrent requests on top of that.
  pool_size: 10

message_db:
  port: 3306
  # Per-server schemas are named postal-server-<id>. The scoped database user is
  # granted on that pattern by deploy/database/init/, and changing this prefix
  # means changing the grant with it.
  database_name_prefix: postal-server

smtp_server:
  # Off here, and switched on from .env rather than by editing this file.
  # SMTP_SERVER_TLS_ENABLED overrides it -- the environment source is pushed
  # before the YAML one in lib/postal/config.rb -- which is what
  # `./deploy.sh tls install` sets once a certificate exists and is readable.
  # Keeping the switch in .env means this committed file stays site-independent
  # and that enabling TLS is never a git change on a deployment host.
  #
  # Cloudflare does not terminate SMTP, so inbound STARTTLS needs a certificate
  # on this host and something to renew it. `./deploy.sh tls` is that something:
  # Let's Encrypt, DNS-01 through the Cloudflare API, and a host timer because the
  # SMTP server reads its certificate once at process start and has no reload.
  #
  # tls_certificate_path and tls_private_key_path are deliberately absent. The
  # schema defaults them to $config-file-root/smtp.cert and smtp.key, which is
  # /config here, and ./config is already mounted there read-only -- so
  # config/smtp.{cert,key} is where ./deploy.sh tls writes and setting the keys
  # would only create a second source of truth to disagree with it.
  #
  # Outbound delivery is unaffected: the worker negotiates STARTTLS with remote
  # servers itself, per their advertised capabilities.
  tls_enabled: false
  # 14MB by default. Kept explicit because it is the setting most often needing
  # to change and the least obvious place to look for it.
  max_message_size: 14

logging:
  # The schema default is false, which sends the Rails logger to /dev/null. In a
  # container the logs are the only observable output, so they are on.
  rails_log_enabled: true

rails:
  environment: production

# Message inspection is off. rspamd, SpamAssassin and ClamAV are separate
# services which this topology does not run, and enabling any of them makes the
# worker attempt to reach a host that does not exist. Add the services to
# docker-compose.yml before flipping these.
rspamd:
  enabled: false
spamd:
  enabled: false
clamav:
  enabled: false
