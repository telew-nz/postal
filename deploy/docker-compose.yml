# Production topology for Postal with the /api/v2 management API.
#
#   ./deploy.sh up
#
# doc/deployment.md is the runbook. This file is the topology it describes.
#
# Six processes, in three groups:
#
#   data      mariadb
#   app       postal (puma: web UI and JSON API), worker (delivery), smtp (inbound)
#   edge      cloudflared (outbound-only tunnel for HTTP)
#
# Plus `bootstrap`, a one-shot runner which deploy.sh invokes for schema load,
# the administrator user and the first API token.
#
# ---------------------------------------------------------------------------
# How traffic reaches each process, and why it differs
#
# HTTP and SMTP take completely different paths, and the reason is not a matter
# of taste. A Cloudflare Tunnel gives a public inbound listener for HTTP and
# HTTPS only. Every other service type it supports -- TCP, SSH, RDP, SMB --
# requires the connecting party to run `cloudflared access <proto>` themselves,
# which the world's mail servers will not do. So:
#
#   HTTP  internet -> Cloudflare edge (TLS) -> cloudflared -> postal:5000
#   SMTP  internet -> this host, port 25 -> smtp
#
# Port 25 is therefore published on the host's public interface and needs a
# public IP, a PTR record and inbound 25 permitted by the provider. Nothing else
# here is reachable from the network: the web process has no published port at
# all, and MariaDB is on loopback.
#
# ---------------------------------------------------------------------------
# Configuration
#
# config/postal.yml is mounted read-only at /config, which is where the image's
# POSTAL_CONFIG_FILE_PATH already points. It is committed and site-independent:
# every value which differs per deployment arrives as an environment variable,
# which Postal::Config applies in preference to the file. That precedence is
# what allows the two worker variants below to share one config file while
# disagreeing about where the database is.
#
# .env holds the secrets and the site-specific names. It is generated by
# `./deploy.sh init`, is gitignored, and is excluded from the Docker build
# context -- see .dockerignore, because Docker does not consult .gitignore.

name: postal

# Bounded container logs.
#
# Docker's json-file driver has no size limit unless one is set, so a mail
# server left running writes to /var/lib/docker/containers/*/*-json.log until the
# disk is full -- and a full disk is a worse failure than the one which filled it,
# because MariaDB stops cleanly at best and corrupts at worst. These options are
# set here rather than in /etc/docker/daemon.json because the daemon's defaults
# are not part of this deployment and cannot be relied on to have been configured.
#
# ./deploy.sh logs reads through Docker, so rotation is transparent to it.
x-logging: &postal-logging
  driver: json-file
  options:
    max-size: ${POSTAL_LOG_MAX_SIZE:-50m}
    max-file: ${POSTAL_LOG_MAX_FILE:-5}

# Shared environment for every Postal process.
#
# RAILS_SECRET_KEY and not SECRET_KEY_BASE: Postal reads rails.secret_key, and
# config/initializers/secret_key.rb falls back to SecureRandom.hex when it is
# nil. Passing the Rails-conventional name instead therefore appears to work
# while giving each container a different key and invalidating every session on
# each restart.
x-postal-env: &postal-env
  RAILS_ENVIRONMENT: production
  RAILS_LOG_ENABLED: ${RAILS_LOG_ENABLED:-true}
  RAILS_SECRET_KEY: ${RAILS_SECRET_KEY:?set RAILS_SECRET_KEY in .env}
  BIND_ADDRESS: 0.0.0.0
  PORT: "5000"
  # A scoped user, granted on `postal`.* and `postal-server-%`.* and nothing
  # else. deploy/database/init/ creates it. Postal makes one schema per server,
  # named postal-server-<id>, which is why the grant needs a pattern.
  MAIN_DB_HOST: mariadb
  MAIN_DB_PORT: "3306"
  MAIN_DB_USERNAME: ${MAIN_DB_USERNAME:-postal}
  MAIN_DB_PASSWORD: ${MAIN_DB_PASSWORD:?set MAIN_DB_PASSWORD in .env}
  MESSAGE_DB_HOST: mariadb
  MESSAGE_DB_PORT: "3306"
  MESSAGE_DB_USERNAME: ${MAIN_DB_USERNAME:-postal}
  MESSAGE_DB_PASSWORD: ${MAIN_DB_PASSWORD:?set MAIN_DB_PASSWORD in .env}
  # config/application.rb pushes exactly one entry onto config.hosts, so
  # ActionDispatch::HostAuthorization answers 403 to every other Host header.
  # cloudflared forwards the public hostname, so this has to be that name and
  # not the origin's. Required rather than defaulted: a wrong value here is a
  # stack which starts cleanly and refuses every request.
  POSTAL_WEB_HOSTNAME: ${POSTAL_WEB_HOSTNAME:?set POSTAL_WEB_HOSTNAME in .env}
  # Announced in the SMTP 220 banner and used for CRAM-MD5 challenges and
  # Received-header loop detection. Should be the name the PTR record resolves
  # to. Note that EHLO does not present it at all -- see doc/deployment.md.
  POSTAL_SMTP_HOSTNAME: ${POSTAL_SMTP_HOSTNAME:?set POSTAL_SMTP_HOSTNAME in .env}
  # Whether the SMTP server offers STARTTLS. Only the smtp process acts on this,
  # but it is declared here rather than on that service alone: deploy.sh doctor
  # reads the resolved configuration from a bootstrap container, and a value only
  # the smtp service had would make doctor report tls_enabled false while the
  # running SMTP server advertises STARTTLS. ./deploy.sh tls sets it.
  #
  # Left false with no certificate present, the SMTP server answers "502 TLS not
  # available" to STARTTLS. Set true with no readable certificate, it answers
  # "220 Ready to start TLS" and then the handshake raises, which server.rb logs
  # at debug level before dropping the connection. Both are worse than the other
  # depending on the sender, so ./deploy.sh tls sets this only after the files
  # are in place and readable.
  SMTP_SERVER_TLS_ENABLED: ${SMTP_SERVER_TLS_ENABLED:-false}
  # Must match postal.trusted_proxies in config/postal.yml. Both are the pinned
  # subnet declared at the bottom of this file; deploy.sh doctor checks that the
  # address cloudflared actually got is inside it.
  POSTAL_USE_IP_POOLS: ${POSTAL_USE_IP_POOLS:-false}
  # The dns.* names. Nothing else carries them into the container: config/postal.yml
  # is committed and declares no dns section, so without these the application
  # resolves every one from lib/postal/config_schema.rb's defaults --
  # mx1.postal.example.com, rp.postal.example.com and the rest -- while
  # ./deploy.sh dns prints the .env values and tells the operator to publish those
  # instead. The two then disagree where it cannot be recovered after the fact:
  # DKIM is signed against dns.return_path_domain, so the receiver looks up
  # postal._domainkey.rp.postal.example.com, finds nothing, and verification fails
  # for every message sent. ./deploy.sh doctor reports any still on example.com.
  #
  # These names are not a convention to guess at. Konfig's environment source
  # builds them as path.map(&:upcase).join("_"), so dns.return_path_domain is
  # DNS_RETURN_PATH_DOMAIN the same way smtp_server.tls_enabled above is
  # SMTP_SERVER_TLS_ENABLED.
  #
  # Defaulted to the schema's own values rather than to empty, and the colon in
  # :- matters: Konfig raises ValueNotPresentError only when a key is absent, so
  # an empty variable is a value, and dns.mx_records -- an array attribute, split
  # on /\s*,\s*/ -- would resolve to [] instead of falling back. A blank in .env
  # therefore behaves exactly like an unset one. Comma-separate several MX names.
  DNS_MX_RECORDS: ${DNS_MX_RECORDS:-mx1.postal.example.com,mx2.postal.example.com}
  DNS_SPF_INCLUDE: ${DNS_SPF_INCLUDE:-spf.postal.example.com}
  DNS_RETURN_PATH_DOMAIN: ${DNS_RETURN_PATH_DOMAIN:-rp.postal.example.com}
  DNS_ROUTE_DOMAIN: ${DNS_ROUTE_DOMAIN:-routes.postal.example.com}
  DNS_TRACK_DOMAIN: ${DNS_TRACK_DOMAIN:-track.postal.example.com}
  # The schema gives helo_hostname no default, and the sender falls back to
  # smtp_hostname before localhost, so that is what an absent value means here.
  DNS_HELO_HOSTNAME: ${DNS_HELO_HOSTNAME:-${POSTAL_SMTP_HOSTNAME}}
  DNS_DKIM_IDENTIFIER: ${DNS_DKIM_IDENTIFIER:-postal}
  DNS_DOMAIN_VERIFY_PREFIX: ${DNS_DOMAIN_VERIFY_PREFIX:-postal-verification}
  DNS_CUSTOM_RETURN_PATH_PREFIX: ${DNS_CUSTOM_RETURN_PATH_PREFIX:-psrp}
  WAIT_FOR_TIMEOUT: "120"
  WAIT_FOR_TARGETS: mariadb:3306

# Shared by the four Postal processes. The image's own entrypoint is kept, which
# is docker/wait-for.sh: it blocks on WAIT_FOR_TARGETS and then execs the
# command. That is belt and braces alongside depends_on below, and it is what
# makes a restart after a database outage recover on its own.
x-postal-app: &postal-app
  image: ${POSTAL_IMAGE:-postal:local}
  restart: unless-stopped
  logging: *postal-logging
  depends_on:
    mariadb:
      condition: service_healthy
  environment:
    <<: *postal-env
  volumes:
    # Read-only: nothing in Postal writes to its config directory, and a
    # container which cannot modify its own DKIM signing key is a container
    # whose signing key cannot be exfiltrated by a compromised process.
    - ./config:/config:ro

services:

  mariadb:
    image: ${MARIADB_IMAGE:-mariadb:11}
    restart: unless-stopped
    # Named explicitly like every other service here. deploy.sh backup and
    # restore both need to address this container while the stack around it is
    # stopped, and the generated name carries the project name and a replica
    # index which neither of them should have to reconstruct.
    container_name: postal-mariadb
    logging: *postal-logging
    # READ-COMMITTED is what Postal expects; the queue draining in the worker
    # relies on row-level locking semantics which REPEATABLE-READ changes.
    command:
      - --transaction-isolation=READ-COMMITTED
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      # Root is used by deploy.sh only, for creating the scoped user and for
      # backups. The application never sees it.
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: postal
    volumes:
      - postal-data:/var/lib/mysql
      # deploy.sh init renders the grant script into here from .env, because it
      # has to name the scoped user and the MariaDB entrypoint runs this
      # directory only on first initialization of an empty volume.
      - ./database/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback only. Published at all because a host-networked worker cannot
      # resolve the `mariadb` DNS name and has to reach the database this way.
      - "127.0.0.1:3306:3306"
    healthcheck:
      # The image's own script waits for InnoDB initialization as well as for the
      # socket, which mariadb-admin ping does not. A suite or a migration started
      # in that window fails in ways that look like application bugs.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - postal

  # The web UI and the JSON API. One Puma process serves both; the API is a
  # route namespace, not a separate service.
  postal:
    <<: *postal-app
    container_name: postal-web
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    healthcheck:
      # The Host header has to be supplied explicitly: config.hosts contains
      # only postal.web_hostname, so a probe to 127.0.0.1 without it is answered
      # 403 by HostAuthorization and the container looks permanently unhealthy.
      # A 302 to the login page is success here -- it proves Rails booted and
      # routing works, which is all liveness needs to know.
      test:
        - CMD-SHELL
        # Quoted because it contains a colon followed by a space, inside the Host
        # header. As a plain YAML scalar that is a mapping indicator, and compose
        # rejects the result with "healthcheck.test.1 must be a string" rather
        # than with anything that points here. The other healthchecks have no
        # colon-space in them and so do not need quoting.
        #
        # $$ is compose's escape for a literal $, so the container's own shell
        # expands POSTAL_WEB_HOSTNAME at probe time rather than compose baking in
        # whatever it was when the file was interpolated.
        - 'curl -fsS -o /dev/null -H "Host: $$POSTAL_WEB_HOSTNAME" http://127.0.0.1:5000/ || exit 1'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - postal

  # Delivers mail by draining the queued_messages table. Postal v3 has no
  # message broker: the queue is a table, and without this process a queued
  # message stays queued forever.
  #
  # Two variants, exactly one of which runs. deploy.sh chooses based on
  # POSTAL_USE_IP_POOLS and always passes the profile explicitly, so the choice
  # never depends on COMPOSE_PROFILES being set correctly in the environment.
  #
  # The bridge variant is the default. It works because a message with no
  # assigned IPAddress is delivered without binding a source address, and
  # lib/worker/jobs/process_queued_messages_job.rb selects on
  # `ip_address_id: [nil, @ip_addresses]`, where @ip_addresses only ever
  # contains addresses present on this container's own interfaces. On a bridge
  # network that set is empty, so this worker claims only unassigned messages
  # and never attempts a bind it cannot satisfy.
  worker:
    <<: *postal-app
    profiles: ["worker-bridge"]
    container_name: postal-worker
    command: ["bundle", "exec", "ruby", "script/worker.rb"]
    environment:
      <<: *postal-env
      HEALTH_SERVER_PORT: "9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - postal

  # The host-networked variant, needed only when IP pools are in use.
  #
  # SMTPClient::Endpoint sets Net::SMTP#source_address from the IPAddress row
  # before connecting, which makes Ruby bind() that address. Under bridge
  # networking the container does not hold the host's public IP, so the bind
  # fails with EADDRNOTAVAIL and nothing assigned to an IP address is ever sent.
  # The same job also matches Socket.ip_address_list against the IPAddress
  # table to decide what it may claim, so the address has to be genuinely
  # present on an interface for the worker to see it at all.
  #
  # Host networking gives up bridge isolation for this one process. It accepts
  # no inbound connections -- its health server binds 127.0.0.1 -- and it is the
  # process which has to speak to the internet as the host anyway.
  worker-hostnet:
    <<: *postal-app
    profiles: ["worker-hostnet"]
    container_name: postal-worker
    network_mode: host
    command: ["bundle", "exec", "ruby", "script/worker.rb"]
    environment:
      <<: *postal-env
      # Cannot resolve the `mariadb` DNS name from the host network namespace,
      # so it uses the loopback publish instead. Environment beats YAML, which
      # is what lets both variants share one config file.
      MAIN_DB_HOST: 127.0.0.1
      MESSAGE_DB_HOST: 127.0.0.1
      WAIT_FOR_TARGETS: 127.0.0.1:3306
      HEALTH_SERVER_PORT: ${WORKER_HEALTH_PORT:-9090}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:${WORKER_HEALTH_PORT:-9090}/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # Inbound SMTP. Published on the public interface because mail has to arrive
  # from the internet and no tunnel can carry it.
  #
  # Bridge networking is fine here: this process only accepts connections and
  # queues what it receives. It never binds a source address, which is the
  # worker's problem, not this one's.
  smtp:
    <<: *postal-app
    container_name: postal-smtp
    command: ["bundle", "exec", "ruby", "script/smtp_server.rb"]
    environment:
      <<: *postal-env
      PORT: "25"
      HEALTH_SERVER_PORT: "9091"
    ports:
      - "25:25"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - postal

  # Outbound-only tunnel connector. It dials Cloudflare and holds the connection
  # open, so no inbound firewall rule and no published port is needed for HTTP.
  #
  # Token mode: ingress rules live in the Cloudflare dashboard, and the hostname
  # must point at http://postal:5000 -- the compose service name, resolvable
  # because cloudflared is on the same network.
  #
  # For a locally-managed tunnel instead, see cloudflared/config.yml.
  #
  # Behind the `tunnel` profile, which ./deploy.sh up activates by default. Two
  # reasons. The token cannot be required at interpolation time, because compose
  # expands the whole file before it decides which services to start, and a `:?`
  # here would refuse to bring up the origin for an operator who has not created a
  # tunnel yet -- with an error that does not suggest what to do instead. And
  # diagnosing the origin directly, without Cloudflare in the path, is a normal
  # thing to need; `./deploy.sh up --without-tunnel` gives it.
  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: ["tunnel"]
    container_name: postal-cloudflared
    restart: unless-stopped
    logging: *postal-logging
    depends_on:
      postal:
        condition: service_healthy
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN:-}"]
    # Pinned subnet, so that postal.trusted_proxies in config/postal.yml can
    # name it. Without this the address cloudflared gets depends on what else
    # is running, and request.ip silently becomes the tunnel's address instead
    # of the client's -- trusted_proxies is what makes Rack believe
    # X-Forwarded-For, and config/initializers/trusted_proxies.rb trusts only
    # loopback and IPv6 ULA by default.
    networks:
      postal:
        ipv4_address: ${CLOUDFLARED_IP:-172.28.0.254}

  # One-shot runner for setup and maintenance. deploy.sh always passes an
  # explicit command; the default here exists so that a bare
  # `docker compose --profile setup run --rm bootstrap` lists what is available
  # rather than doing something irreversible.
  bootstrap:
    <<: *postal-app
    profiles: ["setup"]
    container_name: postal-bootstrap
    restart: "no"
    command: ["bundle", "exec", "rake", "--tasks"]
    # Listed in full because a YAML merge key replaces a sequence outright rather
    # than appending to it: defining `volumes` here without repeating ./config
    # would silently drop the config mount and every command would fall back to
    # the schema defaults.
    #
    # ./lib holds the ruby helpers deploy.sh drives -- ensure_database.rb,
    # ensure_admin.rb, register_ips.rb. They are not in the image because
    # .dockerignore excludes deploy/*, and they should not be: they are
    # deployment tooling, and baking them in would mean a new helper needs an
    # image rebuild to use.
    volumes:
      - ./config:/config:ro
      - ./lib:/deploy-lib:ro
    networks:
      - postal

  # One-shot ACME client, driven entirely by ./deploy.sh tls. With no arguments
  # the image's own default runs, which is --help, for the same reason as
  # bootstrap above: a bare `docker compose --profile tls run --rm acme` should
  # list what is available rather than do something.
  #
  # Not a daemon, and not started by `up`. Renewal has to end with a restart of
  # the smtp container, because SMTPServer::Server memoizes the parsed certificate
  # on the class (`@tls_certificates ||=`) and traps only TERM and INT -- there is
  # no reload signal, so a renewed certificate on disk is invisible to a running
  # process. A restart is a host-side action, so this runs to completion and
  # exits, and a systemd timer calls ./deploy.sh tls renew. The alternative -- a
  # long-lived sidecar with /var/run/docker.sock mounted so that it could restart
  # smtp itself -- would hand root-on-host to a container holding a credential
  # that can write DNS records for the zone.
  #
  # Pinned to a version where cloudflared above is not. That difference is
  # deliberate: this container holds an ACME account key and a Cloudflare token,
  # so a moving tag is a supply-chain risk with an unusually large blast radius,
  # and tracking upstream here buys nothing.
  acme:
    image: ${ACME_IMAGE:-neilpang/acme.sh:3.1.1}
    profiles: ["tls"]
    container_name: postal-acme
    restart: "no"
    logging: *postal-logging
    environment:
      # Where the image keeps account.conf, the account key and every issued
      # certificate. It is already the image's own default and its declared
      # VOLUME; restated so that the mount below documents itself instead of
      # depending on a value baked into an image.
      LE_CONFIG_HOME: /acme.sh
      # Read directly by acme.sh's dns_cf plugin. A scoped API token with
      # Zone/DNS/Edit on this zone and nothing else -- not the global API key,
      # which this plugin also accepts as CF_Key plus CF_Email and which is an
      # account-wide credential.
      CF_Token: ${CLOUDFLARE_DNS_API_TOKEN:-}
    volumes:
      # The state directory, and it has to be this path. /root/.acme.sh holds the
      # program itself -- /usr/local/bin/acme.sh is a symlink into it -- so
      # mounting a host directory there destroys the tool with "not found".
      - ./acme:/acme.sh
      # ./config is deliberately absent. This container has a Cloudflare
      # DNS-edit token, and ./config holds the DKIM signing key, so it is given no
      # write access there. It installs into ./acme/install instead and
      # ./deploy.sh tls copies the two files across, which is also the only place
      # the chown to uid 999 can be done -- the container runs as root and would
      # otherwise leave a key the SMTP server cannot read.
    networks:
      - postal

networks:
  postal:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24

volumes:
  postal-data:
