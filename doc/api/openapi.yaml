  /api/v2/organizations/{organization_permalink}/domains/{domain_uuid}/verify:
    post:
      tags: [Domains]
      operationId: verifyOrganizationDomain
      summary: Verify a domain owned by an organization
      description: |
        For domains using DNS verification no body is needed and the DNS records
        are checked immediately. For domains using e-mail verification either
        provide `code` to complete verification with a code received by e-mail,
        or provide `email_address` to have a verification e-mail dispatched.
      parameters:
        - $ref: '#/components/parameters/OrganizationPermalink'
        - $ref: '#/components/parameters/DomainUUID'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: The verification code from the e-mail.
                email_address:
                  type: string
                  format: email
                  description: |
                    An address which is permitted to verify the domain. The
                    valid addresses are listed in the `422` response returned
                    when an invalid address is given.
      responses:
        '200':
          description: The domain has been verified.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Domain'
        '202':
          description: |
            A verification e-mail has been dispatched. The body contains the
            address it was sent to.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [sent_to]
                    properties:
                      sent_to:
                        type: string
                        format: email
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Verification failed. The `code` will be `AlreadyVerified`,
            `VerificationFailed`, `InvalidVerificationCode` or
            `InvalidEmailAddress`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/organizations/{organization_permalink}/domains/{domain_uuid}/check:
