          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Servers]
      operationId: updateServer
      summary: Update a server
      description: |
        This single operation replaces the separate limits, retention, spam and
        advanced forms in the web interface. The `send_limit`, `allow_sender`,
        `privacy_mode`, `log_smtp_data`, `outbound_spam_threshold`,
        `message_retention_days`, `raw_message_retention_days` and
        `raw_message_retention_size` properties may only be set by an
        administrator; they are silently ignored for other users.
      parameters:
        - $ref: '#/components/parameters/OrganizationPermalink'
        - $ref: '#/components/parameters/ServerPermalink'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                mode:
                  type: string
                  enum: [Live, Development]
                ip_pool_id:
                  type: integer
                spam_threshold:
                  type: number
                spam_failure_threshold:
                  type: number
                postmaster_address:
                  type: string
                send_limit:
                  type: integer
                  description: Administrators only.
                allow_sender:
                  type: boolean
                  description: Administrators only.
                privacy_mode:
                  type: boolean
                  description: Administrators only.
                log_smtp_data:
                  type: boolean
                  description: Administrators only.
                outbound_spam_threshold:
                  type: number
                  description: Administrators only.
