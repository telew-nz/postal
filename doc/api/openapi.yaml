      parameters:
        - $ref: '#/components/parameters/OrganizationPermalink'
        - $ref: '#/components/parameters/ServerPermalink'
        - $ref: '#/components/parameters/MessageID'
      responses:
        '200':
          description: The attachment metadata.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      attachments:
                        type: array
                        items:
                          $ref: '#/components/schemas/Attachment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/organizations/{organization_permalink}/servers/{server_permalink}/messages/{id}/attachment:
    get:
      tags: [Messages]
      operationId: downloadMessageAttachment
      summary: Download one attachment of a message
      parameters:
        - $ref: '#/components/parameters/OrganizationPermalink'
        - $ref: '#/components/parameters/ServerPermalink'
        - $ref: '#/components/parameters/MessageID'
        - $ref: '#/components/parameters/AttachmentIndex'
      responses:
        '200':
          description: |
            The decoded content of the attachment. The `Content-Type` is the one
            the message part declared, so it is not known in advance; the
            filename is given in the `Content-Disposition` header.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/organizations/{organization_permalink}/servers/{server_permalink}/messages/{id}/download:
    get:
      tags: [Messages]
      operationId: downloadMessage
      summary: Download the raw RFC822 message
      description: |
        Returns the message as an `.eml` file. Returns `404` when the raw
        message has expired out of retention.
      parameters:
        - $ref: '#/components/parameters/OrganizationPermalink'
        - $ref: '#/components/parameters/ServerPermalink'
        - $ref: '#/components/parameters/MessageID'
      responses:
        '200':
          description: The raw message.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/organizations/{organization_permalink}/servers/{server_permalink}/messages/{id}/retry:
    post:
      tags: [Messages]
      operationId: retryMessage
      summary: Retry delivery of a message
      description: |
        If the message is already in the queue it is retried immediately,
        otherwise a new queue entry is created and marked as manual. Returns
        `422` with the code `MessageUnavailable` when the raw message is no
        longer stored.
      parameters:
        - $ref: '#/components/parameters/OrganizationPermalink'
        - $ref: '#/components/parameters/ServerPermalink'
        - $ref: '#/components/parameters/MessageID'
      responses:
        '200':
          description: The message after the retry was scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v2/organizations/{organization_permalink}/servers/{server_permalink}/messages/{id}/cancel_hold:
    post:
      tags: [Messages]
      operationId: cancelMessageHold
      summary: Cancel the hold on a message
      parameters:
        - $ref: '#/components/parameters/OrganizationPermalink'
        - $ref: '#/components/parameters/ServerPermalink'
        - $ref: '#/components/parameters/MessageID'
      responses:
        '200':
          description: The message after the hold was cancelled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v2/organizations/{organization_permalink}/servers/{server_permalink}/messages/{id}/remove_from_queue:
    delete:
      tags: [Messages]
      operationId: removeMessageFromQueue
      summary: Remove a message from the delivery queue
      description: |
        This action is idempotent. Removing a message which is not in the queue
        still returns `204`. Messages which are currently locked by a worker
        are left alone.
      parameters:
        - $ref: '#/components/parameters/OrganizationPermalink'
        - $ref: '#/components/parameters/ServerPermalink'
        - $ref: '#/components/parameters/MessageID'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
