  /api/v2/organizations/{organization_permalink}/servers/{server_permalink}/messages:
    get:
      tags: [Messages]
      operationId: listMessages
      summary: List messages for a server
      description: |
        Messages are queried directly from the server's message database. Unlike
        the web interface the query is fully described by the request: nothing
        is stored in a session and the same request always returns the same
        results.
      parameters:
        - $ref: '#/components/parameters/OrganizationPermalink'
        - $ref: '#/components/parameters/ServerPermalink'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: scope
          in: query
          description: The direction of the messages to return.
          schema:
            type: string
            enum: [outgoing, incoming]
            default: outgoing
        - name: to
          in: query
          description: An exact recipient address to filter by.
          schema:
            type: string
        - name: from
          in: query
          description: An exact sender address to filter by.
          schema:
            type: string
        - name: status
          in: query
          description: |
            An exact status to filter by, for example `Sent`, `Held`, `Bounced`
            or `Received`.
          schema:
            type: string
        - name: token
          in: query
          description: The message token to filter by.
          schema:
            type: string
        - name: message_id
          in: query
          description: |
            The RFC822 `Message-ID` header value to filter by. When this is
            provided the `scope` and `spam` filters are dropped so that bounces
            and other related messages are returned too.
          schema:
            type: string
        - name: tag
          in: query
          description: The tag to filter by.
          schema:
            type: string
        - name: id
          in: query
          description: The integer message ID to filter by.
          schema:
            type: integer
        - name: spam
          in: query
          description: Only return messages which were marked as spam.
          schema:
            type: string
            enum: ['true', 'false']
            default: 'false'
        - name: before
          in: query
          description: |
            Only return messages received before this time. Accepts
            `YYYY-MM-DD`, `YYYY-MM-DD HH:MM` or a natural language phrase such
            as `2 hours ago`.
          schema:
            type: string
          example: "2024-01-31 23:59"
        - name: after
          in: query
          description: |
            Only return messages received after this time. Accepts the same
            formats as `before`.
          schema:
            type: string
          example: "2024-01-01"
        - name: order
          in: query
          description: The direction to sort by timestamp.
          schema:
            type: string
            enum: [newest-first, oldest-first]
            default: newest-first
      responses:
        '200':
          description: A paginated list of messages.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            A time filter could not be parsed. The `code` will be
            `TimeUndetermined`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

